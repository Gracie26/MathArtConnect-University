<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Add to Home Screen: opens full screen like an app, with the MathArt Connect icon and name. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MathArt Connect" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Soft Sand / Dark BG from theme/tokens/palette.ts. -->
    <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18212b" media="(prefers-color-scheme: dark)" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* Soft Sand / Dark BG from theme/tokens/palette.ts (sand, charcoal). */
        background-color: #f7f4ef;
      }
      html.mathart-dark body {
        background-color: #18212b;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // Paint the saved theme before the app's JavaScript loads, so a dark page never flashes white.
      // Reads the same record as features/preferences/displayPreferences.ts.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('mathart.display.v1') || '{}');
          var dark =
            saved.theme === 'dark' ||
            (saved.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('mathart-dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
